<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>softly, mia ♡</title>
    <meta name="theme-color" content="#FFF9F5">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.svg') }}" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #FFF9F5;
            --blush: #F8DDE5;
            --rose: #D98FA5;
            --chocolate: #62454D;
            --lavender: #EAE2F3;
            --serif: "Cormorant Garamond", Georgia, serif;
            --sans: "Manrope", "Segoe UI", system-ui, sans-serif;
            --hand: "Caveat", "Segoe Script", cursive;
        }
        * { box-sizing: border-box; }
        html, body { min-height: 100%; }
        body {
            margin: 0;
            display: grid;
            place-items: center;
            min-height: 100vh;
            background:
                radial-gradient(circle at 18% 20%, rgba(248, 221, 229, .8), transparent 38%),
                radial-gradient(circle at 85% 80%, rgba(234, 226, 243, .9), transparent 42%),
                var(--cream);
            color: var(--chocolate);
            font-family: var(--sans);
            text-align: center;
            padding: 32px;
        }
        .redirect-card { max-width: 440px; }
        .heart {
            display: block;
            font-size: 4.5rem;
            line-height: 1;
            color: var(--rose);
            animation: float 3.5s ease-in-out infinite;
        }
        h1 {
            margin: 12px 0 4px;
            font-family: var(--serif);
            font-size: clamp(2.6rem, 9vw, 4rem);
            font-weight: 500;
            letter-spacing: -.02em;
        }
        p {
            margin: 0 auto;
            max-width: 320px;
            color: #8E7379;
            line-height: 1.7;
        }
        .hand {
            margin-top: 18px;
            font-family: var(--hand);
            font-size: 1.5rem;
            color: var(--rose);
        }
        .links {
            display: flex;
            justify-content: center;
            gap: 9px;
            margin-top: 28px;
            font-size: .78rem;
            letter-spacing: .16em;
            text-transform: uppercase;
        }
        .links a {
            color: var(--chocolate);
            text-decoration: none;
            border: 1px solid rgba(98, 69, 77, .18);
            border-radius: 999px;
            padding: 9px 15px;
            transition: .25s ease;
        }
        .links a:hover {
            background: var(--blush);
            border-color: transparent;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        @media (prefers-reduced-motion: reduce) {
            .heart { animation: none; }
        }
    </style>
    <noscript><meta http-equiv="refresh" content="0; url=/en/"></noscript>
</head>
<body>
    <main class="redirect-card">
        <span class="heart" aria-hidden="true">♡</span>
        <h1>softly, mia ♡</h1>
        <p>taking you to a softer corner of the internet…</p>
        <p class="hand">one little second ♡</p>
        <div class="links">
            <a href="/en/" hreflang="en" lang="en">English</a>
            <a href="/ru/" hreflang="ru" lang="ru">Русский</a>
        </div>
    </main>

    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('mia-lang'); } catch (error) {}
            var target = saved === 'ru' ? '/ru/' : '/en/';
            window.location.replace(target);
        })();
    </script>
</body>
</html>
