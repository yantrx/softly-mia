<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">A reading corner</title>
  <desc id="desc">A cosy armchair with a floor lamp, stacked books and a little side table by a rainy window.</desc>
  <defs>
    <linearGradient id="rc-wall" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#F2E8E0"/>
      <stop offset=".55" stop-color="#F6E7E1"/>
      <stop offset="1" stop-color="#EBDDDB"/>
    </linearGradient>
    <linearGradient id="rc-floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFC6B4"/>
      <stop offset="1" stop-color="#CDAF9D"/>
    </linearGradient>
    <linearGradient id="rc-chair" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EBC9CD"/>
      <stop offset=".55" stop-color="#D9A4AE"/>
      <stop offset="1" stop-color="#B98791"/>
    </linearGradient>
    <linearGradient id="rc-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C9D5D9"/>
      <stop offset=".55" stop-color="#E3E7E6"/>
      <stop offset="1" stop-color="#F0E2DE"/>
    </linearGradient>
    <radialGradient id="rc-lamp" cx=".5" cy=".4" r=".6">
      <stop offset="0" stop-color="#FFE2AC" stop-opacity=".9"/>
      <stop offset="1" stop-color="#FFE2AC" stop-opacity="0"/>
    </radialGradient>
    <filter id="rc-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#62454D" flood-opacity=".18"/>
    </filter>
    <filter id="rc-soft"><feGaussianBlur stdDeviation="24"/></filter>
    <filter id="rc-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#rc-wall)"/>
  <rect y="794" width="900" height="331" fill="url(#rc-floor)"/>
  <path d="M0 794h900" stroke="#BE9C87" stroke-width="4" opacity=".55"/>
  <path d="M0 876h900M0 1000h900" stroke="#C5A491" stroke-width="3" opacity=".35"/>

  <!-- window -->
  <g filter="url(#rc-shadow)">
    <rect x="516" y="82" width="312" height="478" rx="8" fill="#F6ECE6"/>
    <rect x="534" y="100" width="276" height="442" rx="4" fill="url(#rc-window)"/>
    <path d="M672 100v442M534 340h276" stroke="#F6ECE6" stroke-width="12"/>
    <!-- outside garden -->
    <path d="M534 460c44-6 80 8 108 42 28 32 60 38 96 18 26-14 50-14 72 8v14H534Z" fill="#A8B393" opacity=".65"/>
    <circle cx="622" cy="392" r="46" fill="#BEC9AE" opacity=".7"/>
    <circle cx="748" cy="364" r="58" fill="#B4C0A4" opacity=".6"/>
    <!-- rain -->
    <g stroke="#FFF9F5" stroke-width="3" stroke-linecap="round" opacity=".65">
      <path d="M566 128l-10 28M624 112l-12 32M700 136l-10 28M770 118l-12 32M574 226l-10 28M660 208l-12 32M748 236l-10 28M790 212l-10 28M596 322l-10 28M680 306l-12 32M764 330l-10 28"/>
    </g>
    <g fill="#FFF9F5" opacity=".55">
      <circle cx="594" cy="190" r="4"/><circle cx="722" cy="176" r="3"/><circle cx="784" cy="280" r="4"/><circle cx="638" cy="288" r="3"/>
    </g>
  </g>
  <path d="M498 54c34 68 40 154 18 260-18 86-16 170 6 242h-58c-16-92-12-186 12-282 20-84 18-156-12-220Z" fill="#F2DDE2" opacity=".85"/>

  <!-- wall art -->
  <g transform="rotate(-3 236 160)" filter="url(#rc-shadow)">
    <rect x="152" y="74" width="168" height="172" rx="4" fill="#FFF9F5"/>
    <rect x="168" y="90" width="136" height="118" fill="#EFDDE6"/>
    <path d="M192 208c14-36 28-56 48-60 20-4 34 18 48 60Z" fill="#C98D98"/>
    <circle cx="236" cy="128" r="18" fill="#F5D9A8"/>
    <path d="M184 226h104M184 236h62" stroke="#D9BFC0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- lamp glow -->
  <ellipse cx="742" cy="570" rx="230" ry="260" fill="url(#rc-lamp)"/>

  <!-- armchair -->
  <g filter="url(#rc-shadow)">
    <path d="M126 780c-22-158 18-292 112-402 32-38 78-42 112-10 58 54 82 170 66 348l-4 64Z" fill="#A97680"/>
    <path d="M164 774c-16-132 16-246 90-342 22-26 52-28 74-6 42 42 58 144 46 288l-2 60Z" fill="url(#rc-chair)"/>
    <path d="M96 724c-12-28 6-52 38-52h56c20 0 32 14 32 34v96H124c-18 0-28-10-28-28Z" fill="#D9A4AE"/>
    <path d="M96 724c-12-28 6-52 38-52h56c20 0 32 14 32 34" fill="none" stroke="#EBC9CD" stroke-width="6" opacity=".75"/>
    <rect x="104" y="766" width="324" height="46" rx="22" fill="#C797A0"/>
    <path d="M144 808v78M396 808v78" stroke="#8E626B" stroke-width="14" stroke-linecap="round"/>
    <!-- cushion -->
    <g transform="rotate(-8 292 666)">
      <rect x="222" y="616" width="150" height="118" rx="28" fill="#F7E4E7"/>
      <path d="M252 650h90M252 672h64" stroke="#E7CFD2" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- folded throw -->
    <path d="M212 706c74-18 148-12 224 18v34c-82-26-156-30-224-10Z" fill="#F3DCE0" opacity=".9"/>
  </g>

  <!-- floor lamp -->
  <g filter="url(#rc-shadow)">
    <ellipse cx="740" cy="850" rx="88" ry="18" fill="#A87F68" opacity=".32"/>
    <rect x="728" y="630" width="24" height="216" rx="8" fill="#8D6A5D"/>
    <rect x="696" y="836" width="88" height="18" rx="9" fill="#8D6A5D"/>
    <path d="M686 520h108l-24 116h-60Z" fill="#E9C8A8"/>
    <path d="M686 520h108" stroke="#D5AE8A" stroke-width="10" stroke-linecap="round"/>
    <path d="M712 540c12 0 22 10 22 22M768 540c-12 0-22 10-22 22" fill="none" stroke="#FFF4DD" stroke-width="4" stroke-linecap="round" opacity=".8"/>
    <ellipse cx="740" cy="638" rx="30" ry="8" fill="#FFF0CD" opacity=".9"/>
  </g>

  <!-- side table with books and tea -->
  <g filter="url(#rc-shadow)">
    <ellipse cx="492" cy="930" rx="120" ry="24" fill="#B89078" opacity=".25"/>
    <ellipse cx="492" cy="706" rx="122" ry="34" fill="#D9BBA6"/>
    <ellipse cx="492" cy="700" rx="122" ry="34" fill="#E5CBB8"/>
    <path d="M456 730v180M528 730v180" stroke="#C8A28B" stroke-width="10" stroke-linecap="round"/>
    <path d="M420 910h144" stroke="#C8A28B" stroke-width="8" stroke-linecap="round"/>
    <!-- book stack -->
    <rect x="420" y="644" width="150" height="18" rx="4" fill="#B98791"/>
    <rect x="430" y="626" width="140" height="18" rx="4" fill="#E3A9B6"/>
    <rect x="414" y="608" width="152" height="18" rx="4" fill="#EFD8E1"/>
    <path d="M444 618h92M456 636h72M446 654h104" stroke="#8E626B" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    <!-- mug -->
    <path d="M542 610h58v36c0 14-13 24-29 24s-29-10-29-24Z" fill="#FFF9F5"/>
    <path d="M600 620c16 0 16 24 0 24" fill="none" stroke="#FFF9F5" stroke-width="8"/>
    <ellipse cx="571" cy="610" rx="29" ry="9" fill="#C99C8D"/>
    <path d="M558 592c-5-10 7-14 3-24M578 590c-5-10 7-14 3-24" fill="none" stroke="#FFF9F5" stroke-width="3" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- rug -->
  <ellipse cx="456" cy="916" rx="330" ry="94" fill="#EAD5CB" opacity=".7"/>
  <ellipse cx="456" cy="916" rx="278" ry="72" fill="#F3DDE2" opacity=".55"/>
  <ellipse cx="456" cy="916" rx="278" ry="72" fill="none" stroke="#E6C9CD" stroke-width="4" opacity=".7"/>

  <!-- slippers -->
  <g fill="#D9A4AE">
    <ellipse cx="214" cy="974" rx="52" ry="20"/>
    <path d="M184 956c0-16 13-26 30-26s30 10 30 26c0 14-13 22-30 22s-30-8-30-22Z" fill="#F2C6D1"/>
    <ellipse cx="298" cy="992" rx="46" ry="18"/>
    <path d="M272 976c0-14 12-24 26-24s26 10 26 24c0 12-12 20-26 20s-26-8-26-20Z" fill="#EBB6C3"/>
  </g>

  <!-- cat on rug -->
  <g fill="#B98791" opacity=".72">
    <ellipse cx="700" cy="1010" rx="86" ry="40"/>
    <circle cx="760" cy="990" r="30"/>
    <path d="M740 968l-8-24 26 14M776 968l14-22 10 28" fill="#B98791"/>
    <path d="M634 1016c-30-10-48-26-48-48 24 3 43 18 48 48Z" fill="#A97680"/>
  </g>

  <ellipse cx="450" cy="1110" rx="430" ry="36" fill="#8D6A5D" opacity=".14" filter="url(#rc-soft)"/>
  <rect width="900" height="1125" filter="url(#rc-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
