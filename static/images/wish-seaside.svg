<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">A window by the sea</title>
  <desc id="desc">An open window with sheer curtains, a striped cushion and the sea outside at golden hour.</desc>
  <defs>
    <linearGradient id="se-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9CDD8"/>
      <stop offset=".45" stop-color="#E4D3D6"/>
      <stop offset=".72" stop-color="#F8D9BF"/>
      <stop offset="1" stop-color="#F5C9B2"/>
    </linearGradient>
    <linearGradient id="se-sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FAEB8"/>
      <stop offset=".55" stop-color="#7C9DAD"/>
      <stop offset="1" stop-color="#6A8B9D"/>
    </linearGradient>
    <linearGradient id="se-wall" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#F7EFE7"/>
      <stop offset="1" stop-color="#EFE0DA"/>
    </linearGradient>
    <linearGradient id="se-sill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3E6DA"/>
      <stop offset="1" stop-color="#E4D0C0"/>
    </linearGradient>
    <filter id="se-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#62454D" flood-opacity=".18"/>
    </filter>
    <filter id="se-soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="se-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#se-wall)"/>

  <!-- frame outside -->
  <rect x="86" y="96" width="728" height="704" rx="10" fill="#EFE3D9" filter="url(#se-shadow)"/>
  <rect x="108" y="118" width="684" height="660" rx="4" fill="url(#se-sky)"/>

  <!-- sun -->
  <circle cx="628" cy="318" r="74" fill="#FBE7BE" opacity=".95"/>
  <circle cx="628" cy="318" r="130" fill="#FBE7BE" opacity=".28" filter="url(#se-soft)"/>

  <!-- clouds -->
  <g fill="#FFF9F5" opacity=".5">
    <ellipse cx="248" cy="236" rx="112" ry="24"/><ellipse cx="318" cy="218" rx="68" ry="20"/>
    <ellipse cx="486" cy="320" rx="86" ry="18"/><ellipse cx="408" cy="288" rx="102" ry="22"/>
  </g>

  <!-- distant headland -->
  <path d="M108 570c74-68 150-92 228-72 58 14 108 44 150 90H108Z" fill="#9A9C99" opacity=".55"/>
  <path d="M520 590c46-48 96-60 150-36 38 18 78 36 122 44v18H520Z" fill="#A8A7A0" opacity=".45"/>

  <!-- sea -->
  <path d="M108 580h684v198H108Z" fill="url(#se-sea)"/>
  <!-- sun path -->
  <path d="M590 580h86l-32 198h-48Z" fill="#F8D9BF" opacity=".55"/>
  <g stroke="#FFF9F5" stroke-linecap="round" opacity=".55">
    <path d="M144 616h86M260 626h128M430 610h92M542 634h230M160 662h156M352 674h112M508 656h88M620 684h124M148 716h108M302 730h168M510 706h124M660 742h88M190 772h150M410 782h112"/>
  </g>
  <!-- waves at shore -->
  <path d="M108 758c60-18 110-16 150 6 40 22 86 20 138-6 52-26 110-24 168 4 58 28 122 26 192-6v24H108Z" fill="#F4DFCE" opacity=".55"/>
  <!-- little sailboat -->
  <g fill="#F7ECE6">
    <path d="M438 632h52l-10 18h-32Z"/>
    <path d="M462 560v72" stroke="#F7ECE6" stroke-width="3"/>
    <path d="M464 570l36 56h-36Z" opacity=".9"/>
  </g>

  <!-- window cross bars -->
  <path d="M450 118v660M108 448h684" stroke="#F3E6DA" stroke-width="16"/>
  <path d="M450 118v660M108 448h684" stroke="#E7D6C8" stroke-width="3" opacity=".5"/>

  <!-- sheer curtains -->
  <g filter="url(#se-shadow)">
    <path d="M86 84c64 130 78 300 42 510-18 108-16 198 6 266H44c-16-114-10-228 18-342 30-124 30-240 0-348 0-30 12-58 24-86Z" fill="#FFF9F5" opacity=".72"/>
    <path d="M814 84c-64 130-78 300-42 510 18 108 16 198-6 266h90c16-114 10-228-18-342-30-124-30-240 0-348 0-30-12-58-24-86Z" fill="#FFF9F5" opacity=".72"/>
    <path d="M92 116c32 156 34 318 6 486M808 116c-32 156-34 318-6 486" fill="none" stroke="#EFE0DE" stroke-width="6" opacity=".75"/>
    <path d="M64 102c18 148 20 294 6 438M836 102c-18 148-20 294-6 438" fill="none" stroke="#F7E8E4" stroke-width="4" opacity=".7"/>
  </g>

  <!-- sill -->
  <g filter="url(#se-shadow)">
    <rect x="58" y="800" width="784" height="78" rx="10" fill="url(#se-sill)"/>
    <rect x="58" y="800" width="784" height="12" rx="5" fill="#FBF3EB"/>
    <path d="M88 878h724" stroke="#D8C0AE" stroke-width="3" opacity=".6"/>
  </g>

  <!-- below sill wall -->
  <rect y="878" width="900" height="247" fill="#EADBD1"/>
  <path d="M0 878h900" stroke="#D8C0AE" stroke-width="4"/>

  <!-- shell and postcard on sill -->
  <g filter="url(#se-shadow)">
    <path d="M180 786c-22-16-26-42-8-58 20-18 48-8 54 18 4 20-10 36-28 40Z" fill="#F3D9CE"/>
    <path d="M186 774c-10-6-14-18-8-26 8-10 22-6 26 6 2 10-6 18-14 20Z" fill="#E3B9AC"/>
    <path d="M176 742c2-12 10-20 22-22" fill="none" stroke="#D9A89A" stroke-width="3" stroke-linecap="round"/>
  </g>
  <g transform="rotate(-6 740 792)" filter="url(#se-shadow)">
    <rect x="670" y="744" width="150" height="96" rx="4" fill="#FFF9F5"/>
    <rect x="682" y="756" width="126" height="64" fill="#DCE6E7"/>
    <path d="M682 820v-28c26-18 50-20 72-6 20 12 38 12 54 2v32Z" fill="#8FAEB8" opacity=".7"/>
    <circle cx="772" cy="780" r="13" fill="#FBE7BE"/>
    <path d="M688 836h80" stroke="#D9BFC0" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- striped cushion -->
  <g filter="url(#se-shadow)">
    <path d="M672 874c-6-70 16-118 66-144 22-12 44-6 56 16 26 46 30 94 12 144-30 18-72 20-124 6Z" fill="#F7ECE4"/>
    <g stroke="#8FAEB8" stroke-width="16" opacity=".65">
      <path d="M700 766c26 44 34 94 24 150M744 746c26 50 34 104 24 158M788 754c22 44 28 92 18 144"/>
    </g>
    <path d="M690 886c-2-54 14-94 54-118" fill="none" stroke="#E4D0C0" stroke-width="5" opacity=".7"/>
  </g>

  <!-- straw hat -->
  <g filter="url(#se-shadow)">
    <ellipse cx="222" cy="980" rx="130" ry="40" fill="#E7C99E"/>
    <ellipse cx="222" cy="966" rx="130" ry="40" fill="#F0D7B2"/>
    <path d="M178 948c0-34 20-56 44-56s44 22 44 56c0 22-20 36-44 36s-44-14-44-36Z" fill="#E3C495"/>
    <path d="M166 970c34-20 78-20 112 0" fill="none" stroke="#D9A4AE" stroke-width="10"/>
    <ellipse cx="222" cy="966" rx="92" ry="24" fill="none" stroke="#D9B98D" stroke-width="3" opacity=".7"/>
  </g>

  <!-- book and sunglasses -->
  <g filter="url(#se-shadow)">
    <rect x="430" y="930" width="220" height="34" rx="6" fill="#B98791"/>
    <rect x="436" y="906" width="208" height="30" rx="6" fill="#EFD8E1"/>
    <rect x="446" y="884" width="188" height="28" rx="6" fill="#F7ECE4"/>
    <path d="M466 922h108M480 946h88M470 972h116" stroke="#8E626B" stroke-width="3" stroke-linecap="round" opacity=".45"/>
    <g transform="translate(700 970) rotate(8)" fill="none" stroke="#6E5968" stroke-width="6">
      <circle cx="0" cy="0" r="24"/><circle cx="66" cy="0" r="24"/><path d="M24 0h18M-24 0l-16-8M90 0l16-8"/>
    </g>
  </g>

  <!-- sand on floor -->
  <g fill="#E3C495" opacity=".6">
    <ellipse cx="760" cy="1080" rx="90" ry="18"/>
    <ellipse cx="680" cy="1050" rx="34" ry="8"/>
    <ellipse cx="820" cy="1040" rx="24" ry="6"/>
  </g>

  <ellipse cx="450" cy="1120" rx="430" ry="26" fill="#8D6A5D" opacity=".12" filter="url(#se-soft)"/>
  <rect width="900" height="1125" filter="url(#se-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
