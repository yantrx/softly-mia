<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">A wishlist flat lay</title>
  <desc id="desc">Polaroids, a pearl necklace, a perfume bottle, a ribbon and a small notebook arranged on linen.</desc>
  <defs>
    <linearGradient id="wl-linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7E9E3"/>
      <stop offset=".55" stop-color="#F1DDD9"/>
      <stop offset="1" stop-color="#E9D2D6"/>
    </linearGradient>
    <linearGradient id="wl-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F6EBE1"/>
    </linearGradient>
    <linearGradient id="wl-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8C98E"/>
      <stop offset="1" stop-color="#C9A56A"/>
    </linearGradient>
    <linearGradient id="wl-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F9E8EE"/>
      <stop offset=".5" stop-color="#EBC7D3"/>
      <stop offset="1" stop-color="#DBA7B9"/>
    </linearGradient>
    <filter id="wl-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="13" flood-color="#62454D" flood-opacity=".16"/>
    </filter>
    <filter id="wl-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#wl-linen)"/>
  <g stroke="#E6CFCC" stroke-width="2" opacity=".5">
    <path d="M0 140h1200M0 330h1200M0 520h1200M0 710h1200"/>
    <path d="M180 0v900M430 0v900M680 0v900M930 0v900" opacity=".5"/>
  </g>

  <!-- big photo frame top left -->
  <g transform="rotate(-7 352 310)" filter="url(#wl-shadow)">
    <rect x="146" y="126" width="412" height="352" rx="6" fill="url(#wl-paper)"/>
    <rect x="174" y="154" width="356" height="252" fill="#E9DCE4"/>
    <rect x="174" y="154" width="356" height="252" fill="#D9E2DE" opacity=".7"/>
    <path d="M174 406h356v-56c-66-40-124-52-178-34-64 20-118 52-178 72Z" fill="#A8B393"/>
    <circle cx="440" cy="222" r="30" fill="#F5D9A8"/>
    <path d="M224 200c30-30 62-42 96-36" fill="none" stroke="#FFF9F5" stroke-width="5" stroke-linecap="round" opacity=".7"/>
    <path d="M274 544c34-10 68-10 102 0" fill="none" stroke="#D9BFC0" stroke-width="5" stroke-linecap="round"/>
    <rect x="296" y="109" width="112" height="29" rx="3" fill="#E8C7A9" opacity=".75" transform="rotate(5 352 123)"/>
  </g>

  <!-- polaroid right -->
  <g transform="rotate(8 922 296)" filter="url(#wl-shadow)">
    <rect x="756" y="116" width="332" height="360" rx="5" fill="#FFFDF9"/>
    <rect x="780" y="140" width="284" height="272" fill="#F2DDE2"/>
    <path d="M780 412v-72c54-54 106-66 152-36 44 28 86 38 132 30v78Z" fill="#D98FA5" opacity=".72"/>
    <path d="M836 200c26-18 58-24 94-16" fill="none" stroke="#FFF9F5" stroke-width="7" stroke-linecap="round" opacity=".7"/>
    <path d="M864 452h116" stroke="#D9BFC0" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- notebook bottom left -->
  <g transform="rotate(6 300 720)" filter="url(#wl-shadow)">
    <rect x="124" y="586" width="366" height="228" rx="12" fill="#D9BBA6"/>
    <rect x="124" y="586" width="366" height="228" rx="12" fill="#E8C9BC"/>
    <rect x="148" y="610" width="318" height="180" rx="8" fill="url(#wl-paper)"/>
    <path d="M172 650h194M172 682h230M172 714h168M172 746h204" stroke="#D9BFC0" stroke-width="4" stroke-linecap="round"/>
    <path d="M148 610h318" stroke="#D98FA5" stroke-width="5"/>
    <circle cx="196" cy="760" r="7" fill="none" stroke="#D98FA5" stroke-width="3"/>
  </g>

  <!-- perfume bottle center -->
  <g filter="url(#wl-shadow)">
    <ellipse cx="618" cy="716" rx="102" ry="22" fill="#A97C87" opacity=".22"/>
    <rect x="548" y="428" width="140" height="170" rx="34" fill="url(#wl-glass)"/>
    <rect x="576" y="470" width="84" height="76" rx="8" fill="#FFF9F5" opacity=".75"/>
    <path d="M598 500h40M598 514h28" stroke="#C28FA0" stroke-width="3" stroke-linecap="round"/>
    <rect x="586" y="386" width="64" height="50" rx="8" fill="url(#wl-gold)"/>
    <rect x="602" y="352" width="32" height="42" rx="6" fill="#E4C48B"/>
    <circle cx="618" cy="352" r="17" fill="#D9B36F"/>
    <path d="M562 448c20-12 42-14 66-6" fill="none" stroke="#FFF9F5" stroke-width="6" stroke-linecap="round" opacity=".6"/>
  </g>

  <!-- pearls -->
  <g fill="none" stroke="#FDF5E4" stroke-width="11" stroke-linecap="round">
    <path d="M410 622c54-66 150-84 234-50 76 30 104 92 52 140-42 38-142 40-210-4"/>
  </g>
  <g fill="#F7EBD3">
    <circle cx="416" cy="616" r="10"/><circle cx="436" cy="590" r="10"/><circle cx="462" cy="568" r="10"/>
    <circle cx="494" cy="552" r="10"/><circle cx="530" cy="542" r="10"/><circle cx="568" cy="540" r="10"/>
    <circle cx="606" cy="546" r="10"/><circle cx="642" cy="558" r="10"/><circle cx="674" cy="578" r="10"/>
    <circle cx="700" cy="604" r="10"/><circle cx="714" cy="638" r="10"/><circle cx="710" cy="672" r="10"/>
    <circle cx="688" cy="700" r="10"/><circle cx="654" cy="714" r="10"/><circle cx="618" cy="716" r="10"/>
    <circle cx="582" cy="708" r="10"/>
  </g>

  <!-- ribbon -->
  <g filter="url(#wl-shadow)">
    <path d="M930 562c78-34 144-12 176 64 28 66-24 118-96 90-58-22-90-78-80-154Z" fill="#D98FA5" opacity=".82"/>
    <path d="M944 584c62-16 112 6 132 64 16 46-16 84-64 72-58-14-82-62-68-136Z" fill="#E3A9B6" opacity=".8"/>
    <path d="M976 620c46-34 88-30 116 12-38 34-78 30-116-12Z" fill="#CB7C93" opacity=".55"/>
  </g>

  <!-- dried flowers top center -->
  <g filter="url(#wl-shadow)">
    <path d="M604 94c-16 72-22 144-18 218M612 94c12 76 22 150 32 218M598 90c-32 56-56 116-64 180" fill="none" stroke="#9A8C72" stroke-width="4" stroke-linecap="round"/>
    <g fill="#D9BFC0">
      <ellipse cx="590" cy="132" rx="16" ry="9" transform="rotate(-34 590 132)"/>
      <ellipse cx="576" cy="176" rx="16" ry="9" transform="rotate(-24 576 176)"/>
      <ellipse cx="626" cy="158" rx="16" ry="9" transform="rotate(28 626 158)"/>
      <ellipse cx="644" cy="204" rx="16" ry="9" transform="rotate(34 644 204)"/>
      <ellipse cx="550" cy="236" rx="16" ry="9" transform="rotate(-22 550 236)"/>
    </g>
  </g>

  <!-- small heart confetti -->
  <g fill="#D98FA5" opacity=".55">
    <path d="M1046 764c-8-5-12-9-12-14 0-4 3-6 6-6s5 1 6 3c1-2 3-3 6-3s6 2 6 6c0 5-4 9-12 14Z"/>
    <path d="M470 476c-7-4-10-8-10-12 0-3 2-5 5-5s4 1 5 2c1-1 2-2 5-2s5 2 5 5c0 4-3 8-10 12Z"/>
  </g>

  <rect width="1200" height="900" filter="url(#wl-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
