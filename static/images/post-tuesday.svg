<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">An ordinary Tuesday desk</title>
  <desc id="desc">A rainy window behind a wooden desk with an open notebook, a cup of tea, a sleeping cat and a small lamp.</desc>
  <defs>
    <linearGradient id="tu-wall" x1="0" y1="0" x2=".5" y2="1">
      <stop offset="0" stop-color="#EEE6E4"/>
      <stop offset=".5" stop-color="#F4E6E2"/>
      <stop offset="1" stop-color="#F7EDE5"/>
    </linearGradient>
    <linearGradient id="tu-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D8E2E5"/>
      <stop offset=".55" stop-color="#E7E9EA"/>
      <stop offset="1" stop-color="#F0E5E4"/>
    </linearGradient>
    <linearGradient id="tu-desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D7B79F"/>
      <stop offset="1" stop-color="#C29A80"/>
    </linearGradient>
    <linearGradient id="tu-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F7EDE4"/>
    </linearGradient>
    <radialGradient id="tu-lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFE7B8" stop-opacity=".95"/>
      <stop offset="1" stop-color="#FFE7B8" stop-opacity="0"/>
    </radialGradient>
    <filter id="tu-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#62454D" flood-opacity=".16"/>
    </filter>
    <filter id="tu-soft"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="tu-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#tu-wall)"/>
  <rect y="646" width="1200" height="254" fill="url(#tu-desk)"/>
  <path d="M0 646h1200" stroke="#B99076" stroke-width="4" opacity=".7"/>
  <path d="M0 700h1200M0 790h1200" stroke="#C9A58C" stroke-width="3" opacity=".4"/>

  <!-- window -->
  <g filter="url(#tu-shadow)">
    <rect x="112" y="72" width="536" height="486" rx="12" fill="#F7EFE9"/>
    <rect x="134" y="94" width="492" height="442" rx="5" fill="url(#tu-window)"/>
    <path d="M380 94v442M134 314h492" stroke="#F7EFE9" stroke-width="14"/>
    <!-- city shapes -->
    <path d="M134 456h48v80h-48zM196 420h58v116h-58zM268 470h44v66h-44zM326 404h62v132h-62zM402 448h52v88h-52zM468 426h48v110h-48zM530 474h42v62h-42zM586 440h40v96h-40z" fill="#D3DCDD" opacity=".85"/>
    <g fill="#E9D18C" opacity=".7">
      <rect x="208" y="438" width="10" height="12"/><rect x="228" y="462" width="10" height="12"/>
      <rect x="342" y="428" width="10" height="12"/><rect x="364" y="456" width="10" height="12"/>
      <rect x="480" y="450" width="10" height="12"/><rect x="542" y="492" width="10" height="12"/>
    </g>
    <!-- rain -->
    <g stroke="#FFF9F5" stroke-width="3" stroke-linecap="round" opacity=".65">
      <path d="M168 130l-12 34M238 108l-14 40M316 142l-11 32M424 112l-13 38M500 146l-11 30M566 118l-13 36M198 226l-12 34M290 252l-14 38M392 216l-12 36M478 250l-13 38M552 226l-11 30M226 348l-12 34M334 376l-13 36M454 342l-12 34M540 372l-12 32"/>
    </g>
    <!-- drops -->
    <g fill="#FFF9F5" opacity=".55">
      <circle cx="184" cy="282" r="4"/><circle cx="272" cy="176" r="3"/><circle cx="348" cy="270" r="5"/>
      <circle cx="452" cy="198" r="4"/><circle cx="546" cy="296" r="3"/>
    </g>
  </g>

  <!-- curtain -->
  <g filter="url(#tu-shadow)">
    <path d="M72 54c44 36 62 118 54 246-7 116-3 216 22 292H74c-18-96-22-200-14-300 7-99 3-172-18-238Z" fill="#F0DCE0" opacity=".9"/>
    <path d="M98 92c18 86 16 206-4 340" fill="none" stroke="#E3C6CC" stroke-width="4" opacity=".7"/>
  </g>

  <!-- warm lamp glow -->
  <ellipse cx="900" cy="500" rx="220" ry="230" fill="url(#tu-lamp)"/>

  <!-- desk lamp -->
  <g filter="url(#tu-shadow)">
    <ellipse cx="928" cy="646" rx="94" ry="16" fill="#A87F68" opacity=".35"/>
    <rect x="914" y="606" width="28" height="40" rx="8" fill="#8D6A5D"/>
    <path d="M928 614c-14-64-62-94-104-118" fill="none" stroke="#8D6A5D" stroke-width="10" stroke-linecap="round"/>
    <path d="M772 460c16-32 48-44 76-26 14 9 22 26 24 44-30 20-68 18-100-18Z" fill="#D9A4AE"/>
    <path d="M788 474c14 10 34 14 58 6" fill="none" stroke="#F2D4DB" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    <circle cx="840" cy="520" r="6" fill="#FFE7B8"/>
  </g>

  <!-- mug -->
  <g filter="url(#tu-shadow)">
    <ellipse cx="710" cy="690" rx="68" ry="16" fill="#A87F68" opacity=".35"/>
    <path d="M648 566h116v70c0 26-25 46-58 46s-58-20-58-46Z" fill="#FFF9F5"/>
    <path d="M762 584c30 0 30 44 0 44" fill="none" stroke="#FFF9F5" stroke-width="13"/>
    <ellipse cx="706" cy="566" rx="58" ry="17" fill="#E5D2C9"/>
    <ellipse cx="706" cy="566" rx="48" ry="12" fill="#B98A72"/>
    <path d="M682 542c-8-16 10-22 4-42M710 538c-8-16 10-22 4-42" fill="none" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <path d="M668 604h20" stroke="#E3A9B6" stroke-width="4" stroke-linecap="round" opacity=".7"/>
  </g>

  <!-- notebook -->
  <g transform="rotate(-5 440 650)" filter="url(#tu-shadow)">
    <rect x="252" y="548" width="392" height="220" rx="12" fill="#D9BBA6"/>
    <rect x="264" y="560" width="180" height="196" rx="6" fill="url(#tu-paper)"/>
    <rect x="452" y="560" width="180" height="196" rx="6" fill="url(#tu-paper)"/>
    <path d="M452 560v196" stroke="#E3CFC2" stroke-width="4"/>
    <g stroke="#D9BFC0" stroke-width="3" stroke-linecap="round">
      <path d="M292 604h116M292 628h132M292 652h102M292 676h122M292 700h84"/>
      <path d="M480 604h116M480 628h132M480 652h102M480 676h122"/>
    </g>
    <path d="M292 730c26-14 58-14 92-4" fill="none" stroke="#D98FA5" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <path d="M464 538c24 10 52 12 80 6" fill="none" stroke="#B99076" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- pen and glasses -->
  <g>
    <rect x="586" y="742" width="206" height="16" rx="8" fill="#B98791" transform="rotate(-12 689 750)"/>
    <path d="M580 756l-24 8 10-20Z" fill="#D9BBA6"/>
    <g transform="rotate(8 340 786)" fill="none" stroke="#8D6A5D" stroke-width="6">
      <circle cx="290" cy="786" r="27"/><circle cx="390" cy="786" r="27"/><path d="M317 782c22-10 46-10 68 0"/>
    </g>
  </g>

  <!-- sleeping cat -->
  <g filter="url(#tu-shadow)">
    <ellipse cx="1012" cy="704" rx="118" ry="56" fill="#C79A96"/>
    <path d="M900 712c-16-52 16-88 62-88 30 0 56 16 70 40 18 12 46 18 68 34 20 14 4 42-24 44-52 4-112 0-176-30Z" fill="#D9AEA8"/>
    <circle cx="968" cy="630" r="42" fill="#D9AEA8"/>
    <path d="M938 606l-10-34 34 18M996 602l16-32 18 34" fill="#D9AEA8"/>
    <path d="M950 632c4 4 9 4 13 0M982 632c4 4 9 4 13 0" fill="none" stroke="#8E626B" stroke-width="3" stroke-linecap="round"/>
    <path d="M966 646c5 3 10 3 15 0" fill="none" stroke="#8E626B" stroke-width="3" stroke-linecap="round"/>
    <path d="M912 704c56 16 110 18 166 4" fill="none" stroke="#C08284" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <path d="M1020 742c36 10 72 2 94-20" fill="none" stroke="#C08284" stroke-width="12" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- plant on sill -->
  <g filter="url(#tu-shadow)">
    <path d="M698 512c-3-40 8-68 34-86M702 510c22-30 44-52 76-64" fill="none" stroke="#7D8B6D" stroke-width="5" stroke-linecap="round"/>
    <path d="M724 460c-28 0-44 14-48 40 26 2 43-12 48-40Z" fill="#94A381"/>
    <path d="M746 448c20-24 44-26 68-6-18 22-42 24-68 6Z" fill="#7D8B6D"/>
    <path d="M770 430c2-22 16-36 38-38 2 22-12 36-38 38Z" fill="#A8B393"/>
    <path d="M668 512h80l-11 54h-58Z" fill="#E9D8D0"/>
    <path d="M674 520h68" stroke="#D8BEB6" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- soft shadows and vignette -->
  <ellipse cx="590" cy="880" rx="540" ry="60" fill="#8D6A5D" opacity=".18" filter="url(#tu-soft)"/>
  <rect width="1200" height="900" filter="url(#tu-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
