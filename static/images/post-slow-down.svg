<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Slow evening by the window</title>
  <desc id="desc">A girl wrapped in a blanket reads by a window at dusk, with fairy lights and a cup of tea nearby.</desc>
  <defs>
    <linearGradient id="sd-room" x1="0" y1="0" x2=".6" y2="1">
      <stop offset="0" stop-color="#403A50"/>
      <stop offset=".5" stop-color="#5A4C5E"/>
      <stop offset="1" stop-color="#75606A"/>
    </linearGradient>
    <linearGradient id="sd-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F3B55"/>
      <stop offset=".55" stop-color="#6F6A83"/>
      <stop offset="1" stop-color="#E7A7A1"/>
    </linearGradient>
    <linearGradient id="sd-blanket" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3DDD4"/>
      <stop offset=".6" stop-color="#E8C4BF"/>
      <stop offset="1" stop-color="#D9A9AC"/>
    </linearGradient>
    <radialGradient id="sd-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#FFD9A3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#FFD9A3" stop-opacity="0"/>
    </radialGradient>
    <filter id="sd-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#1E1826" flood-opacity=".4"/>
    </filter>
    <filter id="sd-glowblur"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="sd-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sd-room)"/>

  <!-- window -->
  <g filter="url(#sd-shadow)">
    <rect x="654" y="78" width="454" height="584" rx="10" fill="#2C2937"/>
    <rect x="676" y="100" width="410" height="540" rx="4" fill="url(#sd-window)"/>
    <path d="M881 100v540M676 370h410" stroke="#3A3445" stroke-width="14"/>
    <!-- moon and stars -->
    <circle cx="986" cy="200" r="44" fill="#FFF0CD" opacity=".9"/>
    <circle cx="1000" cy="188" r="40" fill="#6F6A83" opacity=".85"/>
    <g fill="#FFF3D6" opacity=".8">
      <circle cx="734" cy="154" r="3"/><circle cx="790" cy="214" r="2.5"/><circle cx="842" cy="148" r="2"/>
      <circle cx="936" cy="290" r="2.5"/><circle cx="720" cy="300" r="2"/><circle cx="1028" cy="336" r="3"/>
      <circle cx="778" cy="330" r="2"/><circle cx="906" cy="248" r="2"/>
    </g>
    <!-- city silhouette -->
    <path d="M676 640v-88h34v-36h36v46h42v-66h50v84h48v-50h50v42h52v-74h44v92h36v50Z" fill="#39344A" opacity=".9"/>
    <g fill="#FFD9A3" opacity=".75">
      <rect x="698" y="580" width="9" height="12"/><rect x="762" y="540" width="9" height="12"/>
      <rect x="838" y="556" width="9" height="12"/><rect x="922" y="576" width="9" height="12"/>
      <rect x="1014" y="520" width="9" height="12"/><rect x="1062" y="584" width="9" height="12"/>
    </g>
    <path d="M676 540c72-42 132-60 188-54 64 6 112 30 168 70v84H676Z" fill="#433950" opacity=".7"/>
  </g>

  <!-- curtain -->
  <g filter="url(#sd-shadow)">
    <path d="M598 54c50 78 64 190 44 336-16 116-14 218 12 302h-82c-20-104-22-214-8-330 14-118 20-218-20-308Z" fill="#8A6A72" opacity=".85"/>
    <path d="M608 104c24 106 22 226-4 360" fill="none" stroke="#A87C83" stroke-width="5" opacity=".55"/>
  </g>

  <!-- fairy lights -->
  <g>
    <path d="M80 84c92 66 210 94 348 82 118-10 214 14 290 72" fill="none" stroke="#3A3445" stroke-width="3"/>
    <g filter="url(#sd-glowblur)" fill="#FFD9A3" opacity=".7">
      <circle cx="150" cy="112" r="12"/><circle cx="242" cy="146" r="12"/><circle cx="338" cy="168" r="12"/>
      <circle cx="438" cy="168" r="12"/><circle cx="534" cy="186" r="12"/><circle cx="628" cy="222" r="12"/>
    </g>
    <g fill="#FFEBC4">
      <circle cx="150" cy="112" r="6"/><circle cx="242" cy="146" r="6"/><circle cx="338" cy="168" r="6"/>
      <circle cx="438" cy="168" r="6"/><circle cx="534" cy="186" r="6"/><circle cx="628" cy="222" r="6"/>
    </g>
  </g>

  <!-- warm lamp glow -->
  <ellipse cx="222" cy="408" rx="210" ry="200" fill="url(#sd-glow)" opacity=".45"/>

  <!-- armchair -->
  <g filter="url(#sd-shadow)">
    <path d="M132 690c-14-136 18-246 96-330 38-40 84-44 118-8 44 46 62 132 54 258l-2 146H132Z" fill="#B98791"/>
    <path d="M174 684c-8-112 16-202 74-270 24-28 50-30 70-4 28 36 38 102 32 200l-2 140H174Z" fill="#D5A0AA"/>
    <rect x="116" y="646" width="304" height="46" rx="22" fill="#C797A0"/>
    <path d="M160 692v86M392 692v86" stroke="#8E626B" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- girl reading, seen from behind -->
  <g filter="url(#sd-shadow)">
    <!-- blanket around shoulders -->
    <path d="M206 690c-28-124-16-230 28-316 22-42 60-62 104-56 50 8 82 46 88 112 4 52-10 120-32 206l-8 58Z" fill="url(#sd-blanket)"/>
    <path d="M222 674c-18-108-8-198 28-272" fill="none" stroke="#F7E8E2" stroke-width="7" opacity=".55"/>
    <path d="M312 686c-8-74-4-136 12-186" fill="none" stroke="#C98D93" stroke-width="4" opacity=".35"/>
    <!-- hair -->
    <path d="M290 276c-34 0-58 30-58 76 0 52 22 82 58 82s58-30 58-82c0-46-24-76-58-76Z" fill="#4A3340"/>
    <path d="M240 344c-10 62-4 104 18 132M340 338c12 54 10 94-6 126" fill="none" stroke="#4A3340" stroke-width="20" stroke-linecap="round"/>
    <path d="M258 306c20-18 48-18 68 0" fill="none" stroke="#6B4A57" stroke-width="5" stroke-linecap="round" opacity=".6"/>
    <!-- book -->
    <g transform="rotate(-10 300 548)">
      <rect x="196" y="486" width="214" height="146" rx="7" fill="#6E5968"/>
      <rect x="208" y="496" width="94" height="126" rx="3" fill="#FFF6EA"/>
      <rect x="306" y="496" width="94" height="126" rx="3" fill="#FFF6EA"/>
      <path d="M305 496v126" stroke="#D9BFC0" stroke-width="3"/>
      <path d="M226 524h56M226 544h48M226 564h58M326 524h50M326 544h58M326 564h42" stroke="#CFB7B9" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- hands -->
    <ellipse cx="222" cy="624" rx="24" ry="18" fill="#E8C4BF"/>
    <ellipse cx="380" cy="610" rx="24" ry="18" fill="#E8C4BF"/>
  </g>

  <!-- tea on side table -->
  <g filter="url(#sd-shadow)">
    <ellipse cx="488" cy="748" rx="108" ry="20" fill="#1E1826" opacity=".35"/>
    <rect x="412" y="640" width="152" height="18" rx="8" fill="#7C5B55"/>
    <path d="M430 658v74M546 658v74" stroke="#6B4D49" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="488" cy="640" rx="76" ry="16" fill="#8D6A5D"/>
    <path d="M454 574h72v42c0 16-16 28-36 28s-36-12-36-28Z" fill="#F3E4DD"/>
    <path d="M524 584c20 0 20 30 0 30" fill="none" stroke="#F3E4DD" stroke-width="9"/>
    <ellipse cx="488" cy="574" rx="36" ry="11" fill="#C99C8D"/>
    <path d="M472 554c-6-12 8-18 4-32M494 552c-6-12 8-18 4-32" fill="none" stroke="#FFEBC4" stroke-width="3.4" stroke-linecap="round" opacity=".65"/>
  </g>

  <!-- book stack on floor -->
  <g filter="url(#sd-shadow)">
    <rect x="470" y="802" width="220" height="30" rx="6" fill="#8E626B"/>
    <rect x="458" y="772" width="200" height="30" rx="6" fill="#D5A0AA"/>
    <rect x="482" y="742" width="184" height="30" rx="6" fill="#E8C4BF"/>
    <path d="M500 756h130M494 786h116M508 816h144" stroke="#8E626B" stroke-width="3" stroke-linecap="round" opacity=".5"/>
  </g>

  <!-- plant silhouette -->
  <g fill="#4A4258" opacity=".85">
    <path d="M112 688c-22-92-14-160 22-206M112 688c30-64 62-108 98-132M112 688c-42-48-64-98-68-150" fill="none" stroke="#4A4258" stroke-width="6" stroke-linecap="round"/>
    <ellipse cx="138" cy="512" rx="34" ry="18" transform="rotate(-30 138 512)"/>
    <ellipse cx="204" cy="566" rx="34" ry="18" transform="rotate(24 204 566)"/>
    <ellipse cx="86" cy="568" rx="32" ry="17" transform="rotate(-44 86 568)"/>
  </g>

  <rect width="1200" height="900" filter="url(#sd-grain)" opacity=".1" style="mix-blend-mode:overlay"/>
</svg>
