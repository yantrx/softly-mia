<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1125" role="img" aria-labelledby="title desc">
  <title id="title">The little film camera</title>
  <desc id="desc">A cream and tan film camera resting on rumpled linen with a film roll and sunlight.</desc>
  <defs>
    <linearGradient id="ca-linen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2E4DC"/>
      <stop offset=".5" stop-color="#EEDAD4"/>
      <stop offset="1" stop-color="#E4CFD1"/>
    </linearGradient>
    <linearGradient id="ca-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5EADF"/>
      <stop offset=".55" stop-color="#E4CDBD"/>
      <stop offset="1" stop-color="#D3B5A2"/>
    </linearGradient>
    <linearGradient id="ca-leather" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B98791"/>
      <stop offset="1" stop-color="#8E626B"/>
    </linearGradient>
    <radialGradient id="ca-lens" cx=".45" cy=".4" r=".6">
      <stop offset="0" stop-color="#7C8794"/>
      <stop offset=".6" stop-color="#343B47"/>
      <stop offset="1" stop-color="#1E2430"/>
    </radialGradient>
    <filter id="ca-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#62454D" flood-opacity=".22"/>
    </filter>
    <filter id="ca-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="900" height="1125" fill="url(#ca-linen)"/>
  <g stroke="#DFC7C4" stroke-width="2" opacity=".5">
    <path d="M0 130h900M0 310h900M0 490h900M0 670h900M0 850h900M0 1030h900"/>
    <path d="M150 0v1125M360 0v1125M570 0v1125M780 0v1125" opacity=".45"/>
  </g>

  <!-- soft folds -->
  <path d="M0 430c210-56 390-40 540 48 126 74 246 82 360 24v174c-166 48-320 30-462-56-132-80-278-96-438-48Z" fill="#F7ECE6" opacity=".55"/>
  <path d="M0 880c190-48 352-26 486 66 118 82 256 92 414 30v149H0Z" fill="#E7D2D1" opacity=".45"/>

  <!-- sunlight -->
  <path d="M0 0h280L120 1125H0Z" fill="#FFF7E2" opacity=".5"/>

  <!-- camera body -->
  <g filter="url(#ca-shadow)">
    <rect x="122" y="378" width="656" height="424" rx="52" fill="url(#ca-body)"/>
    <rect x="122" y="378" width="656" height="424" rx="52" fill="none" stroke="#C9A28C" stroke-width="4" opacity=".6"/>
    <!-- leather grip -->
    <path d="M140 430h172v330H188c-30 0-48-18-48-48Z" fill="url(#ca-leather)"/>
    <path d="M156 462h138v16H156zM156 500h138v16H156zM156 538h138v16H156zM156 576h138v16H156zM156 614h138v16H156zM156 652h138v16H156zM156 690h138v16H156z" fill="#7C4F59" opacity=".35"/>
    <!-- top plate -->
    <rect x="300" y="340" width="260" height="54" rx="24" fill="#E7D2C3"/>
    <rect x="412" y="310" width="96" height="44" rx="14" fill="#D5B7A4"/>
    <rect x="432" y="316" width="56" height="14" rx="7" fill="#8E626B" opacity=".7"/>
    <!-- viewfinder -->
    <rect x="580" y="414" width="144" height="90" rx="14" fill="#4A3C43"/>
    <rect x="594" y="428" width="116" height="62" rx="7" fill="#7C8794" opacity=".55"/>
    <path d="M604 436l38-3" stroke="#FFF9F5" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <!-- shutter button and dials -->
    <circle cx="338" cy="352" r="26" fill="#C9988A"/>
    <circle cx="338" cy="352" r="15" fill="#B98791"/>
    <circle cx="590" cy="352" r="34" fill="#C9A28C"/>
    <circle cx="590" cy="352" r="24" fill="#E4CDBD"/>
    <path d="M590 332v20M570 352h20M590 372v-10M610 352h-10" stroke="#A97C6A" stroke-width="3" stroke-linecap="round"/>
    <!-- lens -->
    <circle cx="452" cy="584" r="152" fill="#B98791"/>
    <circle cx="452" cy="584" r="138" fill="#8E626B"/>
    <circle cx="452" cy="584" r="118" fill="#D9BBA6"/>
    <circle cx="452" cy="584" r="96" fill="url(#ca-lens)"/>
    <circle cx="452" cy="584" r="64" fill="#151A24"/>
    <circle cx="428" cy="558" r="26" fill="#FFF9F5" opacity=".22"/>
    <circle cx="492" cy="620" r="13" fill="#D98FA5" opacity=".5"/>
    <circle cx="452" cy="584" r="118" fill="none" stroke="#C9A28C" stroke-width="3" opacity=".55"/>
    <g fill="#F7ECE6" opacity=".55">
      <circle cx="452" cy="480" r="3"/><circle cx="552" cy="566" r="3"/><circle cx="364" cy="602" r="3"/>
    </g>
    <!-- brand plate -->
    <rect x="602" y="588" width="118" height="26" rx="6" fill="#FFF9F5" opacity=".65"/>
    <path d="M620 601h80" stroke="#B98791" stroke-width="4" stroke-linecap="round"/>
    <!-- strap lugs -->
    <path d="M120 470c-34 12-34 60 0 72M780 470c34 12 34 60 0 72" fill="none" stroke="#8E626B" stroke-width="10"/>
  </g>

  <!-- film roll -->
  <g transform="rotate(-16 700 890)" filter="url(#ca-shadow)">
    <rect x="612" y="812" width="192" height="122" rx="20" fill="#4A3C43"/>
    <rect x="630" y="830" width="156" height="86" rx="10" fill="#5C4B55"/>
    <circle cx="708" cy="873" r="34" fill="#2F2833"/>
    <circle cx="708" cy="873" r="18" fill="#8E626B"/>
    <path d="M656 846h54M656 862h32M752 884h18" stroke="#D5B7A4" stroke-width="4" stroke-linecap="round" opacity=".7"/>
    <rect x="800" y="836" width="18" height="76" rx="9" fill="#2F2833"/>
  </g>
  <path d="M640 956c42 26 88 30 136 12" fill="none" stroke="#4A3C43" stroke-width="8" stroke-linecap="round" opacity=".55"/>

  <!-- dried flower sprig -->
  <g>
    <path d="M180 900c-12-92 2-172 42-240M184 900c34-74 74-126 118-156" fill="none" stroke="#8A9877" stroke-width="4" stroke-linecap="round"/>
    <g fill="#C4CDB3">
      <ellipse cx="172" cy="832" rx="22" ry="12" transform="rotate(-32 172 832)"/>
      <ellipse cx="190" cy="782" rx="22" ry="12" transform="rotate(-16 190 782)"/>
      <ellipse cx="214" cy="736" rx="22" ry="12" transform="rotate(-12 214 736)"/>
      <ellipse cx="252" cy="784" rx="20" ry="11" transform="rotate(30 252 784)"/>
      <ellipse cx="286" cy="756" rx="20" ry="11" transform="rotate(22 286 756)"/>
    </g>
  </g>

  <!-- handwritten heart note -->
  <g transform="rotate(8 760 1030)" filter="url(#ca-shadow)">
    <rect x="656" y="974" width="208" height="116" rx="6" fill="#FFF9F5"/>
    <path d="M684 1012c6-8 18-8 24 0 6-8 18-8 24 0 0 12-24 24-24 24s-24-12-24-24Z" fill="#D98FA5"/>
    <path d="M746 1018h86M746 1036h64M746 1054h74" stroke="#D9BFC0" stroke-width="3.5" stroke-linecap="round"/>
  </g>

  <rect width="900" height="1125" filter="url(#ca-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
