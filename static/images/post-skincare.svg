<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Morning skincare shelf</title>
  <desc id="desc">A sunlit bathroom shelf with glass bottles, a round mirror, eucalyptus and a soft towel.</desc>
  <defs>
    <linearGradient id="sk-wall" x1="0" y1="0" x2=".4" y2="1">
      <stop offset="0" stop-color="#FBF1E9"/>
      <stop offset=".55" stop-color="#F6E6E3"/>
      <stop offset="1" stop-color="#EFE1EE"/>
    </linearGradient>
    <linearGradient id="sk-mirror" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDF2F1"/>
      <stop offset=".5" stop-color="#F8E9EA"/>
      <stop offset="1" stop-color="#DDE6E5"/>
    </linearGradient>
    <linearGradient id="sk-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF7F2" stop-opacity=".95"/>
      <stop offset="1" stop-color="#E9D3C9" stop-opacity=".95"/>
    </linearGradient>
    <linearGradient id="sk-amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E3B489"/>
      <stop offset="1" stop-color="#BF8357"/>
    </linearGradient>
    <linearGradient id="sk-sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF4D9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#FFF4D9" stop-opacity="0"/>
    </linearGradient>
    <filter id="sk-shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#62454D" flood-opacity=".15"/>
    </filter>
    <filter id="sk-soft"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="sk-grain">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".5"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#sk-wall)"/>
  <path d="M0 0h520L200 900H0Z" fill="url(#sk-sun)"/>
  <path d="M640 0h80L380 900h-80Z" fill="#FFF9F5" opacity=".16"/>

  <!-- tiled wall hint -->
  <g stroke="#EBD6CE" stroke-width="2" opacity=".55">
    <path d="M0 120h1200M0 300h1200M0 480h1200M0 660h1200"/>
    <path d="M180 0v120M540 0v120M900 0v120M120 120v180M480 120v180M840 120v180M180 300v180M600 300v180M960 300v180M120 480v180M480 480v180M840 480v180"/>
  </g>

  <!-- round mirror -->
  <g filter="url(#sk-shadow)">
    <circle cx="820" cy="330" r="218" fill="#E7C8B8"/>
    <circle cx="820" cy="330" r="198" fill="url(#sk-mirror)"/>
    <circle cx="820" cy="330" r="198" fill="none" stroke="#FFF9F5" stroke-width="7" opacity=".7"/>
    <path d="M680 258c42-70 132-106 214-82" fill="none" stroke="#FFF9F5" stroke-width="14" stroke-linecap="round" opacity=".55"/>
    <path d="M720 462c56-13 112-51 146-110" fill="none" stroke="#FFF9F5" stroke-width="6" stroke-linecap="round" opacity=".3"/>
  </g>

  <!-- wall art / postcard -->
  <g transform="rotate(-4 410 214)" filter="url(#sk-shadow)">
    <rect x="320" y="128" width="180" height="220" rx="4" fill="#FFF9F5"/>
    <rect x="340" y="148" width="140" height="148" fill="#F3DCE2"/>
    <path d="M372 296c18-46 33-72 54-78 24-7 40 20 56 78Z" fill="#D98FA5" opacity=".75"/>
    <circle cx="416" cy="192" r="21" fill="#FFF0CF"/>
    <path d="M358 326h104M358 336h68" stroke="#D9BFC0" stroke-width="3" stroke-linecap="round"/>
    <rect x="432" y="112" width="54" height="20" rx="3" fill="#EAD3BA" transform="rotate(8 459 122)" opacity=".9"/>
  </g>

  <!-- hanging eucalyptus -->
  <g filter="url(#sk-shadow)">
    <path d="M1034 58c3 132-14 258-46 376" fill="none" stroke="#8A9877" stroke-width="6" stroke-linecap="round"/>
    <g fill="#94A381">
      <ellipse cx="1030" cy="120" rx="27" ry="16" transform="rotate(-28 1030 120)"/>
      <ellipse cx="1056" cy="158" rx="27" ry="16" transform="rotate(12 1056 158)"/>
      <ellipse cx="1008" cy="190" rx="27" ry="16" transform="rotate(-30 1008 190)"/>
      <ellipse cx="1024" cy="238" rx="27" ry="16" transform="rotate(6 1024 238)"/>
      <ellipse cx="988" cy="284" rx="27" ry="16" transform="rotate(-34 988 284)"/>
      <ellipse cx="1000" cy="336" rx="27" ry="16" transform="rotate(2 1000 336)"/>
      <ellipse cx="962" cy="380" rx="25" ry="15" transform="rotate(-36 962 380)"/>
    </g>
    <g fill="#7D8B6D">
      <ellipse cx="1075" cy="198" rx="23" ry="14" transform="rotate(24 1075 198)"/>
      <ellipse cx="1042" cy="270" rx="23" ry="14" transform="rotate(18 1042 270)"/>
      <ellipse cx="1008" cy="340" rx="23" ry="14" transform="rotate(-6 1008 340)"/>
    </g>
  </g>

  <!-- shelf -->
  <g filter="url(#sk-shadow)">
    <rect x="82" y="626" width="712" height="30" rx="8" fill="#D9BBA6"/>
    <rect x="82" y="626" width="712" height="9" rx="4" fill="#EBD2C1"/>
    <path d="M130 656l-14 38M744 656l14 38" stroke="#C8A28B" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- folded towel -->
  <g>
    <rect x="562" y="548" width="192" height="34" rx="14" fill="#FFF9F5"/>
    <rect x="576" y="566" width="164" height="30" rx="13" fill="#F3DCE0"/>
    <rect x="590" y="584" width="136" height="26" rx="12" fill="#FFF9F5"/>
    <path d="M604 566h108M618 584h82" stroke="#E7CFD2" stroke-width="2.5" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- products -->
  <g filter="url(#sk-shadow)">
    <!-- tall amber dropper -->
    <rect x="172" y="438" width="92" height="188" rx="22" fill="url(#sk-amber)"/>
    <rect x="190" y="462" width="56" height="72" rx="6" fill="#FFF9F5" opacity=".86"/>
    <path d="M204 484h30M204 498h22M204 512h26" stroke="#C9A58C" stroke-width="3" stroke-linecap="round"/>
    <rect x="202" y="404" width="32" height="40" rx="7" fill="#6F5149"/>
    <rect x="208" y="382" width="20" height="26" rx="6" fill="#8A6A61"/>
    <path d="M218 360v24" stroke="#8A6A61" stroke-width="7" stroke-linecap="round"/>

    <!-- milky bottle -->
    <rect x="306" y="476" width="104" height="150" rx="26" fill="url(#sk-glass)"/>
    <rect x="324" y="502" width="68" height="76" rx="8" fill="#FFFDFC" opacity=".92"/>
    <path d="M340 524h36M340 538h26" stroke="#D9BFC0" stroke-width="3" stroke-linecap="round"/>
    <rect x="330" y="448" width="56" height="34" rx="10" fill="#E8C9BC"/>
    <rect x="348" y="426" width="20" height="24" rx="5" fill="#D98FA5"/>

    <!-- pump serum -->
    <rect x="446" y="500" width="78" height="126" rx="18" fill="#F5E1E6"/>
    <rect x="462" y="520" width="46" height="60" rx="6" fill="#FFF9F5" opacity=".8"/>
    <rect x="470" y="470" width="30" height="34" rx="6" fill="#D9BBA6"/>
    <path d="M486 470v-22h24v12h-10" fill="none" stroke="#C8A28B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- small jar -->
    <rect x="650" y="548" width="96" height="78" rx="18" fill="#EFD8E1"/>
    <rect x="656" y="532" width="84" height="26" rx="10" fill="#DDB7C4"/>
    <path d="M676 584h44" stroke="#FFF9F5" stroke-width="4" stroke-linecap="round" opacity=".9"/>

    <!-- tiny vase with stem -->
    <path d="M540 560c0 34 9 66 22 66s22-32 22-66Z" fill="#DCE6E2"/>
    <path d="M562 560c-2-42 8-70 26-88" fill="none" stroke="#8A9877" stroke-width="4"/>
    <path d="M576 506c-18 2-28 18-27 38 18-2 29-17 27-38Z" fill="#94A381"/>
    <path d="M583 482c4-15 16-23 32-22-1 16-13 25-32 22Z" fill="#D98FA5"/>
  </g>

  <!-- water drops on mirror -->
  <g fill="#FFF9F5" opacity=".55">
    <circle cx="744" cy="236" r="4"/><circle cx="770" cy="262" r="3"/><circle cx="892" cy="218" r="5"/>
    <circle cx="916" cy="404" r="4"/><circle cx="742" cy="414" r="3"/>
  </g>

  <!-- base / counter -->
  <rect y="760" width="1200" height="140" fill="#EAD8CE"/>
  <path d="M0 760h1200" stroke="#DCC5B8" stroke-width="4"/>
  <ellipse cx="430" cy="790" rx="380" ry="28" fill="#DCC5B8" opacity=".35" filter="url(#sk-soft)"/>

  <rect width="1200" height="900" filter="url(#sk-grain)" opacity=".07" style="mix-blend-mode:multiply"/>
</svg>
